name: Daily News Digest

on:
  schedule:
    # Ogni mattina alle 07:00 ora italiana (05:00 UTC in estate, 06:00 in inverno)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permette di lanciarlo manualmente

jobs:
  genera-oggi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Genera contenuto del giorno
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/daily-content.mjs

      - name: Genera carosello Instagram
        run: node scripts/daily-carousel.mjs

      - name: Genera Reel Instagram (richiede FFmpeg, pre-installato su ubuntu-latest)
        continue-on-error: true
        run: node scripts/daily-reel.mjs

      - name: Genera e invia newsletter
        continue-on-error: true
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_GROUP_ID: ${{ secrets.MAILERLITE_GROUP_ID }}
        run: node scripts/daily-newsletter.mjs

      - name: Commit e push JSON + slide PNG + newsletter HTML
        run: |
          git config user.name "Compasso Bot"
          git config user.email "bot@compasso-politico.it"
          git add data/daily/ public/carousels/ public/reels/ data/newsletters/
          git diff --staged --quiet || git commit -m "chore: recap + carosello + reel + newsletter $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
